name: Verify protocol reference
on:
  push:
    branches: [develop]
    paths: [.github/workflows/reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch manufacturer document mirror
        run: |
          mkdir reference
          curl --fail --location --retry 3 https://raw.githubusercontent.com/voyo/ThesslaGreen-modbus/main/ProtokolModbusRTU_AirPack4.pdf -o reference/ProtokolModbusRTU_AirPack4.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-reference
          path: reference/
          retention-days: 1
          if-no-files-found: error
