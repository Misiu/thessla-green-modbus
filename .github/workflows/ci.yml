name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and strict typing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m compileall -q src tests script

  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.connection }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            connection: '==4.8.1'
          - python: '3.13'
            connection: '>=4.8.1,<5'
          - python: '3.14'
            connection: '>=4.8.1,<5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the selected dependency version
        env:
          CONNECTION: ${{ matrix.connection }}
        run: python -m pip install '.[dev]' "modbus-connection${CONNECTION}"
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Verify the read-only CLI with a synthetic snapshot
        run: python script/query.py unused --snapshot tests/fixtures/airpack4.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install and import the wheel outside the source tree
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/python -c 'from thessla_green_modbus import AirPack4; from importlib.resources import files; assert files("thessla_green_modbus").joinpath("py.typed").is_file()'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
